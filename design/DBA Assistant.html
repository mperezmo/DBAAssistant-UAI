<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>DBA Assistant · Plataforma IA para administración de bases de datos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* DBA Assistant — Empresarial moderno, amistoso pero contenido */


:root {
  /* Paleta neutra clara */
  --white: #FFFFFF;
  --gray-50: #F7F8F9;
  --gray-100: #EFF1F3;
  --gray-200: #E3E6EA;
  --gray-300: #CDD2D8;
  --gray-400: #A8AEB6;
  --gray-500: #7A828D;
  --gray-600: #525B66;
  --gray-700: #353D47;
  --gray-800: #1F252D;
  --gray-900: #0E1218;

  --paper: var(--white);

  --ink-900: var(--gray-900);
  --ink-800: var(--gray-800);
  --ink-700: var(--gray-700);
  --ink-600: var(--gray-600);
  --ink-500: var(--gray-500);
  --ink-400: var(--gray-400);
  --ink-300: var(--gray-300);

  --blue-900: #0A2F8F;
  --blue-700: #1E4FBF;
  --blue-500: #3B82E0;
  --blue-300: #94B8FF;
  --blue-100: #E4ECFA;
  --blue-50: #F2F6FD;

  --terracotta: #C9462C;
  --terracotta-light: #E5856B;
  --terracotta-bg: #FBE7E0;

  --mustard: #B88321;
  --mustard-light: #D9A441;
  --mustard-bg: #FBF1D9;

  --sage: #4F7A47;
  --sage-bg: #E4EEDE;

  /* Surface tokens — todo blanco/gris claro */
  --bg: var(--gray-50);
  --bg-elev: var(--white);
  --bg-sunk: var(--gray-100);
  --fg: var(--ink-900);
  --fg-muted: var(--ink-600);
  --fg-faint: var(--ink-500);
  --line: var(--gray-200);
  --line-strong: var(--gray-300);
  --accent: var(--blue-700);
  --accent-strong: var(--blue-900);
  --danger: var(--terracotta);
  --warn: var(--mustard);
  --ok: var(--sage);

  /* Typography — UI sans corporativa, serif solo en acentos */
  --font-display: 'Inter', system-ui, sans-serif;
  --font-serif: 'Instrument Serif', Georgia, serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;

  --radius-sm: 4px;
  --radius: 6px;
  --radius-lg: 10px;

  --shadow-sm: 0 1px 2px rgba(15,20,30,0.04);
  --shadow: 0 1px 3px rgba(15,20,30,0.06), 0 1px 2px rgba(15,20,30,0.04);
  --shadow-lg: 0 8px 24px rgba(15,20,30,0.10);
}

[data-theme="dark"] {
  --white: #161B22;
  --gray-50: #0D1117;
  --gray-100: #161B22;
  --gray-200: #21262D;
  --gray-300: #2F353D;
  --gray-400: #484F58;
  --gray-500: #6E7681;
  --gray-600: #8B949E;
  --gray-700: #B1BAC4;
  --gray-800: #C9D1D9;
  --gray-900: #F0F6FC;

  --paper: #161B22;
  --bg: #0D1117;
  --bg-elev: #161B22;
  --bg-sunk: #0A0E13;
  --fg: #F0F6FC;
  --fg-muted: #B1BAC4;
  --fg-faint: #8B949E;
  --line: #21262D;
  --line-strong: #30363D;
  --accent: var(--blue-500);
  --accent-strong: var(--blue-300);

  --terracotta-bg: #3D2018;
  --mustard-bg: #3A2D12;
  --sage-bg: #1F2A18;
  --blue-100: #142442;
  --blue-50: #0F1B33;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'cv11', 'ss01', 'cv02';
  letter-spacing: -0.005em;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
  padding: 0;
}

input, textarea, select {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

#app {
  min-height: 100vh;
  background: var(--bg);
}

/* ========== AUTH SCREEN — Minimalista ========== */
.auth-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  padding: 40px 24px;
  position: relative;
}

.auth-screen::before {
  content: "DBA ASSISTANT · EST. MMXXVI";
  position: absolute;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--fg-faint);
}

.auth-card {
  width: 100%;
  max-width: 400px;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 40px 36px;
  box-shadow: var(--shadow);
}

.auth-brand-stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 32px;
}
.auth-brand-stack .auth-brand-name {
  font-family: var(--font-serif);
  font-size: 24px;
  font-weight: 400;
  letter-spacing: 0;
  margin-top: 14px;
  color: var(--fg);
}
.auth-brand-stack .auth-brand-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg-faint);
  margin-top: 2px;
}

.auth-form {
  width: 100%;
}

.field {
  margin-bottom: 14px;
}
.field label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--fg);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--bg-elev);
  font-size: 14px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.field input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--blue-50);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  font-weight: 500;
  font-size: 14px;
  letter-spacing: -0.005em;
  transition: all 0.12s;
  border: 1px solid transparent;
  white-space: nowrap;
}
.btn-primary {
  background: var(--blue-700);
  color: var(--white);
  border-color: var(--blue-700);
}
.btn-primary:hover {
  background: var(--blue-900);
  border-color: var(--blue-900);
}
.btn-ghost {
  background: var(--bg-elev);
  color: var(--fg);
  border-color: var(--line-strong);
}
.btn-ghost:hover {
  background: var(--bg-sunk);
  border-color: var(--gray-400);
}
.btn-danger {
  background: var(--terracotta);
  color: var(--white);
  border-color: var(--terracotta);
}
.btn-block { width: 100%; }
.btn-sm { padding: 7px 12px; font-size: 13px; }

.auth-foot {
  margin-top: 18px;
  text-align: center;
  font-size: 12px;
  color: var(--fg-faint);
}
.auth-foot a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
}

/* ========== APP SHELL ========== */
.app-shell {
  display: grid;
  grid-template-columns: 232px 1fr;
  min-height: 100vh;
}

.sidebar {
  background: var(--bg-elev);
  border-right: 1px solid var(--line);
  padding: 16px 0;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 4px 18px 18px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 14px;
}
.sidebar-brand-name {
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 400;
  color: var(--fg);
}
.sidebar-brand-tag {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--fg-faint);
  margin-top: 1px;
}

.nav-section {
  padding: 0 10px;
  margin-bottom: 14px;
}
.nav-section-title {
  font-size: 10.5px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--fg-faint);
  padding: 6px 10px;
  margin-bottom: 2px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  color: var(--fg-muted);
  cursor: pointer;
  transition: all 0.1s;
  width: 100%;
  text-align: left;
  position: relative;
  font-weight: 450;
}
.nav-item:hover {
  background: var(--bg-sunk);
  color: var(--fg);
}
.nav-item.active {
  background: var(--blue-50);
  color: var(--accent-strong);
  font-weight: 600;
}
.nav-item.active::before {
  content: "";
  position: absolute;
  left: -10px;
  top: 4px;
  bottom: 4px;
  width: 2px;
  background: var(--accent);
  border-radius: 0 2px 2px 0;
}
.nav-item.disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.nav-item .nav-icon {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  opacity: 0.85;
}
.nav-item .nav-badge {
  margin-left: auto;
  background: var(--terracotta);
  color: var(--white);
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 8px;
  font-weight: 600;
}

.sidebar-foot {
  margin-top: auto;
  padding: 14px 10px;
  border-top: 1px solid var(--line);
}

.user-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.user-card:hover { background: var(--bg-sunk); }
.user-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--blue-700);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
  letter-spacing: 0;
}
.user-info {
  flex: 1;
  min-width: 0;
}
.user-name {
  font-size: 13px;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.user-role {
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--fg-faint);
}

/* ========== MAIN AREA ========== */
.main {
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  background: var(--bg-elev);
  border-bottom: 1px solid var(--line);
  padding: 0 28px;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 18px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.crumbs {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--fg-faint);
}
.crumbs strong { color: var(--fg); font-weight: 600; }
.crumbs .sep { color: var(--line-strong); }

.topbar-spacer { flex: 1; }

.env-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 11px;
  border-radius: 20px;
  background: var(--bg-sunk);
  border: 1px solid var(--line-strong);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 600;
  cursor: pointer;
}
.env-pill .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--ok);
}
.env-pill[data-env="PROD"] .dot { background: var(--terracotta); }
.env-pill[data-env="TESTING"] .dot { background: var(--mustard); }
.env-pill[data-env="DEV"] .dot { background: var(--sage); }

.icon-btn {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--fg-muted);
  position: relative;
}
.icon-btn:hover { background: var(--bg-sunk); color: var(--fg); }
.icon-btn .pulse-dot {
  position: absolute;
  top: 6px;
  right: 7px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--terracotta);
  border: 1.5px solid var(--bg-elev);
}

/* ========== PAGE ========== */
.page {
  padding: 28px 32px 40px;
  max-width: 1400px;
  width: 100%;
}

.page-head {
  margin-bottom: 24px;
}
.page-eyebrow {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 8px;
}
.page-title {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin: 0 0 6px;
  color: var(--fg);
}
.page-title em {
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 400;
  color: var(--fg);
  letter-spacing: -0.01em;
}
.page-subtitle {
  color: var(--fg-muted);
  font-size: 14px;
  max-width: 720px;
  margin: 0;
  line-height: 1.55;
}

/* ========== CARD ========== */
.card {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  position: relative;
}
.card-head {
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.card-title {
  font-family: var(--font-display);
  font-size: 14.5px;
  font-weight: 600;
  letter-spacing: -0.005em;
  margin: 0;
  color: var(--fg);
}
.card-eyebrow {
  font-size: 10.5px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--fg-faint);
  margin-bottom: 3px;
  font-weight: 600;
}
.card-body {
  padding: 18px;
}
.card-foot {
  padding: 10px 18px;
  border-top: 1px solid var(--line);
  background: var(--bg-sunk);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-faint);
  letter-spacing: 0.04em;
}

.card-deco {
  background: var(--bg-elev);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  padding: 4px;
}
.card-deco-inner {
  border: 1px dashed var(--line);
  border-radius: var(--radius-sm);
  padding: 16px 18px;
}

/* ========== UTILITIES ========== */
.row { display: flex; align-items: center; gap: 12px; }
.col { display: flex; flex-direction: column; gap: 12px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 7px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-weight: 600;
  background: var(--bg-sunk);
  color: var(--fg-muted);
  border: 1px solid var(--line);
}
.tag-blue { background: var(--blue-50); color: var(--blue-900); border-color: var(--blue-100); }
.tag-red { background: var(--terracotta-bg); color: var(--terracotta); border-color: rgba(201,70,44,0.2); }
.tag-yellow { background: var(--mustard-bg); color: var(--mustard); border-color: rgba(184,131,33,0.25); }
.tag-green { background: var(--sage-bg); color: var(--sage); border-color: rgba(79,122,71,0.2); }

[data-theme="dark"] .tag-yellow { color: var(--mustard-light); }
[data-theme="dark"] .tag-green { color: #9DBE8A; }
[data-theme="dark"] .tag-blue { color: var(--blue-300); }
[data-theme="dark"] .tag-red { color: var(--terracotta-light); }

.metric-large {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 600;
  letter-spacing: -0.025em;
  line-height: 1;
  color: var(--fg);
  font-variant-numeric: tabular-nums;
}
.metric-mono {
  font-family: var(--font-mono);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.divider {
  height: 1px;
  background: var(--line);
  margin: 14px 0;
}

.kbd {
  display: inline-block;
  padding: 1px 6px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  background: var(--bg-sunk);
  border: 1px solid var(--line-strong);
  border-bottom-width: 2px;
  border-radius: 3px;
  color: var(--fg-muted);
}

/* Ornament — más sobrio */
.ornament {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--gray-400);
  margin: 16px 0;
  font-size: 10px;
}
.ornament::before, .ornament::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
  max-width: 80px;
}

/* Scrollbars */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--gray-400); }

/* Mobile container */
.mobile-mock {
  width: 360px;
  margin: 0 auto;
  background: var(--bg-elev);
  border: 12px solid var(--gray-900);
  border-radius: 32px;
  padding: 0;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  position: relative;
}
.mobile-mock::before {
  content: "";
  position: absolute;
  top: 6px;
  left: 50%;
  transform: translateX(-50%);
  width: 100px;
  height: 20px;
  background: var(--gray-900);
  border-radius: 0 0 12px 12px;
  z-index: 5;
}

/* Charts — bordes uniformes */
.chart-bar {
  fill: var(--blue-100);
  stroke: var(--blue-700);
  stroke-width: 1;
}
.chart-bar-alt {
  fill: var(--bg-sunk);
  stroke: var(--gray-400);
  stroke-width: 1;
}
.chart-line {
  fill: none;
  stroke: var(--accent);
  stroke-width: 1.5;
}
.chart-area {
  fill: var(--blue-50);
  stroke: var(--accent);
  stroke-width: 1;
}
.chart-grid {
  stroke: var(--line);
  stroke-width: 1;
  stroke-dasharray: 2 3;
}
.chart-axis {
  stroke: var(--line-strong);
  stroke-width: 1;
}

/* Animations */
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
@keyframes spin {
  from { transform: rotate(0); }
  to { transform: rotate(360deg); }
}
@keyframes blip {
  0% { transform: scale(1); opacity: 1; }
  100% { transform: scale(2.4); opacity: 0; }
}

.live-dot {
  position: relative;
  display: inline-flex;
  width: 8px;
  height: 8px;
}
.live-dot::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--ok);
  animation: blip 1.6s ease-out infinite;
}
.live-dot::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--ok);
}

/* Data table */
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.data-table th {
  text-align: left;
  padding: 10px 14px;
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--fg-faint);
  border-bottom: 1px solid var(--line);
  background: var(--bg-sunk);
}
.data-table td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover { background: var(--bg-sunk); }

</style>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}

}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

// Midcentury circular gauge — half-circle dial with tick marks
function Gauge({ label, value, unit, max = 100, warn = 70, crit = 85 }) {
  const pct = Math.min(value / max, 1);
  const angle = -90 + pct * 180;
  const color = value >= crit ? 'var(--terracotta)' : value >= warn ? 'var(--mustard)' : 'var(--sage)';

  // Arc path
  const cx = 100, cy = 100, r = 72;
  const startAngle = -180; // left
  const endAngle = 0; // right
  const arc = (start, end) => {
    const s = (start * Math.PI) / 180;
    const e = (end * Math.PI) / 180;
    const x1 = cx + r * Math.cos(s);
    const y1 = cy + r * Math.sin(s);
    const x2 = cx + r * Math.cos(e);
    const y2 = cy + r * Math.sin(e);
    return `M${x1},${y1} A${r},${r} 0 0,1 ${x2},${y2}`;
  };

  // Ticks
  const ticks = [];
  for (let i = 0; i <= 10; i++) {
    const t = startAngle + (i / 10) * 180;
    const tr = (t * Math.PI) / 180;
    const inner = i % 5 === 0 ? r - 12 : r - 6;
    const outer = r;
    ticks.push({
      x1: cx + inner * Math.cos(tr), y1: cy + inner * Math.sin(tr),
      x2: cx + outer * Math.cos(tr), y2: cy + outer * Math.sin(tr),
      major: i % 5 === 0
    });
  }

  // Needle position
  const needleAngle = (angle * Math.PI) / 180;
  const nx = cx + (r - 18) * Math.cos(needleAngle);
  const ny = cy + (r - 18) * Math.sin(needleAngle);

  return (
    <div style={{textAlign:'center'}}>
      <div style={{fontFamily:'var(--font-mono)', fontSize:10, letterSpacing:'0.16em', textTransform:'uppercase', color:'var(--fg-faint)', marginBottom:6}}>
        {label}
      </div>
      <svg viewBox="0 0 200 120" style={{width:'100%', maxWidth:200, height:'auto'}}>
        {/* Outer track */}
        <path d={arc(startAngle, endAngle)} stroke="var(--line)" strokeWidth="14" fill="none" strokeLinecap="butt"/>
        {/* Warn zone */}
        <path d={arc(startAngle + ((warn/max)*180), startAngle + ((crit/max)*180))} stroke="var(--mustard-bg)" strokeWidth="14" fill="none"/>
        {/* Crit zone */}
        <path d={arc(startAngle + ((crit/max)*180), endAngle)} stroke="var(--terracotta-bg)" strokeWidth="14" fill="none"/>
        {/* Active fill */}
        <path d={arc(startAngle, startAngle + pct*180)} stroke={color} strokeWidth="14" fill="none" strokeLinecap="butt"/>
        {/* Ticks */}
        {ticks.map((t,i) => (
          <line key={i} x1={t.x1} y1={t.y1} x2={t.x2} y2={t.y2} stroke="var(--ink-700)" strokeWidth={t.major?1.4:0.7} opacity={t.major?0.8:0.4}/>
        ))}
        {/* Needle */}
        <line x1={cx} y1={cy} x2={nx} y2={ny} stroke="var(--ink-900)" strokeWidth="2.5" strokeLinecap="round"/>
        <circle cx={cx} cy={cy} r="6" fill="var(--ink-900)" stroke="var(--bg-elev)" strokeWidth="1"/>
        <circle cx={cx} cy={cy} r="2" fill="var(--bg-elev)"/>
      </svg>
      <div style={{marginTop:-10}}>
        <div className="metric-large" style={{fontSize:34, color}}>
          {value}<span style={{fontSize:14, color:'var(--fg-muted)', marginLeft:2}}>{unit}</span>
        </div>
      </div>
    </div>
  );
}

function TimeSeriesChart() {
  const points = 60;
  // Generate three sample series
  const cpu = Array.from({length:points}, (_,i) => 50 + Math.sin(i*0.3)*15 + Math.cos(i*0.7)*8 + Math.random()*4);
  const mem = Array.from({length:points}, (_,i) => 70 + Math.sin(i*0.18+1)*10 + Math.random()*3);
  const sess = Array.from({length:points}, (_,i) => 320 + Math.sin(i*0.4)*30 + Math.random()*10);

  const W = 1100, H = 240, P = 30;
  const xs = i => P + (i/(points-1)) * (W - P*2);
  const ys = (v, max=100) => H - P - (v/max) * (H - P*2);

  const path = (data, max=100) => data.map((v,i)=>(i?'L':'M')+xs(i)+','+ys(v,max)).join(' ');
  const sessMax = 400;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%', height:'auto', display:'block'}}>
      {/* Grid */}
      {[0,25,50,75,100].map(v => (
        <g key={v}>
          <line x1={P} y1={ys(v)} x2={W-P} y2={ys(v)} stroke="var(--line)" strokeWidth={v===0?1:0.5} strokeDasharray={v===0?'none':'2,4'}/>
          <text x={P-6} y={ys(v)+3} textAnchor="end" fontSize="9" fill="var(--fg-faint)" fontFamily="var(--font-mono)">{v}</text>
        </g>
      ))}
      {/* X axis labels */}
      {[0,15,30,45,59].map(i => (
        <text key={i} x={xs(i)} y={H-10} textAnchor="middle" fontSize="9" fill="var(--fg-faint)" fontFamily="var(--font-mono)">
          -{60-i}m
        </text>
      ))}
      {/* CPU area */}
      <path d={path(cpu) + ` L${xs(points-1)},${H-P} L${xs(0)},${H-P} Z`} fill="var(--blue-50)" stroke="var(--blue-700)" strokeWidth="1.2"/>
      <path d={path(cpu)} stroke="var(--blue-700)" strokeWidth="1.6" fill="none"/>
      {/* MEM */}
      <path d={path(mem)} stroke="var(--terracotta)" strokeWidth="1.4" fill="none" strokeDasharray="4,3"/>
      {/* SESS scaled */}
      <path d={path(sess, sessMax).replace(/[\d.]+(?=,)/g, m => m).split(' ').map((cmd,i)=>{
        if (!cmd.match(/[\d.]+,[\d.]+/)) return cmd;
        const [x,y] = cmd.replace(/[ML]/,'').split(',').map(Number);
        const prefix = cmd[0]==='M'?'M':'L';
        return `${prefix}${x},${y}`;
      }).join(' ')} stroke="var(--mustard)" strokeWidth="1.4" fill="none" opacity="0.85"/>
      {/* Now indicator */}
      <line x1={xs(points-1)} y1={P} x2={xs(points-1)} y2={H-P} stroke="var(--accent)" strokeWidth="1" strokeDasharray="3,3" opacity="0.5"/>
      <circle cx={xs(points-1)} cy={ys(cpu[points-1])} r="4" fill="var(--blue-700)"/>
    </svg>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "role": "DS",
  "env": "PROD",
  "theme": "light"
}/*EDITMODE-END*/;

function App() {
  const [authed, setAuthed] = React.useState(true);
  const [page, setPage] = React.useState('dashboard');
  window.__goTo = setPage;
  window.__setAuthed = setAuthed;
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', tweaks.theme);
  }, [tweaks.theme]);

  if (!authed) {
    return <LoginScreen onLogin={() => setAuthed(true)}/>;
  }

  const pages = {
    dashboard: PageDashboard, chat: PageChat, monitor: PageMonitor,
    alerts: PageAlerts, workarounds: PageWorkarounds, sandbox: PageSandbox,
    context: PageContext, schema: PageSchema, audit: PageAudit,
    admin: PageAdmin, mobile: PageMobile
  };
  const PageComp = pages[page] || PageDashboard;

  return (
    <div className="app-shell">
      <Sidebar active={page} onNav={setPage} role={tweaks.role}/>
      <main className="main">
        <Topbar active={page} env={tweaks.env} onEnvClick={()=>{}} onAlerts={()=>setPage('alerts')}/>
        <PageComp role={tweaks.role} env={tweaks.env} goTo={setPage}/>
      </main>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Sesión">
          <TweakSelect
            label="Rol activo"
            value={tweaks.role}
            onChange={v => setTweak('role', v)}
            options={Object.entries(ROLES).map(([k,r]) => ({value:k, label:`${r.code} · ${r.short}`}))}
          />
          <TweakRadio
            label="Ambiente"
            value={tweaks.env}
            onChange={v => setTweak('env', v)}
            options={[{value:'DEV',label:'DEV'},{value:'TESTING',label:'TEST'},{value:'PROD',label:'PROD'}]}
          />
        </TweakSection>
        <TweakSection title="Apariencia">
          <TweakRadio
            label="Tema"
            value={tweaks.theme}
            onChange={v => setTweak('theme', v)}
            options={[{value:'light',label:'Claro'},{value:'dark',label:'Oscuro'}]}
          />
        </TweakSection>
        <TweakSection title="Atajos">
          <button className="btn btn-ghost btn-block" onClick={() => setAuthed(false)} style={{marginTop:6}}>
            Ver pantalla de Login
          </button>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}
