{% extends "base_simple.html" %}

{% block contenido %}
<div class="text-center">
  <h1 class="card-title mb-2">{{ t("error.titulo") }}</h1>
  <p class="text-sm text-fg-muted">{{ mensaje }}</p>
  <p class="mt-3 font-mono text-xs text-fg-faint">{{ t("error.codigo") }}: {{ codigo }}</p>
</div>
{% if hay_tenant %}
<a href="/ingresar" class="btn btn-ghost btn-block mt-4">{{ t("error.volver") }}</a>
{% endif %}
{% endblock %}
