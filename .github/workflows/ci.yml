name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  calidad:
    name: Linter y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Dependencias del sistema (ODBC)
        run: sudo apt-get update && sudo apt-get install -y unixodbc
      - run: uv sync --frozen
      - name: Linter
        run: uv run ruff check .
      - name: Formato
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest

  imagenes:
    name: Build de imágenes Docker
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - name: Backend
        run: docker build -t dba-assistant-backend ./backend
      - name: NGINX
        run: docker build -t dba-assistant-nginx -f nginx/Dockerfile .
