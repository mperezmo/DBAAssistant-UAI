name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  calidad:
    name: Linter y tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Dependencias del sistema (ODBC)
        run: sudo apt-get update && sudo apt-get install -y unixodbc
      - run: uv sync --frozen
      - name: Linter
        run: uv run ruff check .
      - name: Formato
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest

  integracion:
    name: Tests de integración
    runs-on: ubuntu-24.04
    needs: calidad
    defaults:
      run:
        working-directory: backend
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Integracion#2026
        ports: ["14330:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Integracion#2026 -Q 'SELECT 1'"
          --health-interval 10s --health-retries 12 --health-start-period 30s
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
    env:
      SQLSERVER_HOST: localhost
      SQLSERVER_PUERTO: "14330"
      SECRETO_SQLSERVER_PASSWORD: Integracion#2026
      SECRETO_MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Driver ODBC 18
        run: |
          if ! odbcinst -q -d | grep -q "ODBC Driver 18"; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update && sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          fi
      - run: uv sync --frozen
      - name: Tests de integración
        run: uv run pytest -m integracion --no-cov

  imagenes:
    name: Build de imágenes Docker
    runs-on: ubuntu-24.04
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - name: Backend
        run: docker build -t dba-assistant-backend ./backend
      - name: NGINX
        run: docker build -t dba-assistant-nginx -f nginx/Dockerfile .
